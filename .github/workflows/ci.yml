name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

# 同一 PR/分支新 push 时取消正在运行的旧 workflow，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # 1. 代码格式检查（最快，先挡下风格问题）
  # ------------------------------------------------------------------------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run format check
        run: scripts/format.sh --check

  # ------------------------------------------------------------------------
  # 2. 多平台/多编译器/多配置 构建 + 测试矩阵
  # ------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.lib_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        lib_type: [SHARED, STATIC]
        exclude:
          # macOS 上没有 gcc（其 gcc 是 clang 的别名），避免重复
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Select compiler (Linux gcc)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc"   >> "$GITHUB_ENV"
          echo "CXX=g++"  >> "$GITHUB_ENV"

      - name: Select compiler (Linux clang)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          echo "CC=clang"   >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build/ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DINFRA_LIBRARY_TYPE=${{ matrix.lib_type }}
          -DINFRA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  # ------------------------------------------------------------------------
  # 3. 静态分析（只在 Linux/clang 上跑，避免矩阵爆炸）
  # ------------------------------------------------------------------------
  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    # 历史代码 tidy 告警较多，先作为"报告"角色不阻塞 CI；
    # 待存量告警清零后移除本行，让 tidy 成为强制门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build

      - name: Configure (generate compile_commands.json)
        run: >
          cmake -S . -B build/linux-debug-ninja
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: scripts/tidy.sh build/linux-debug-ninja
